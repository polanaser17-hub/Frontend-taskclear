<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskClear</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../frontend/index.css">
</head>


<body>


    <!-- Navbar -->
    <nav class="navbar bg-white border-bottom">

        <div class="container py-3">

            <a href="#" class="navbar-brand fw-semibold text-primary">
                TaskClear
            </a>

            <i class="bi bi-person-circle fs-4 text-primary"></i>

        </div>

    </nav>



    <!-- Main -->
    <main class="container py-5">


        <!-- Header -->
        <div class="d-flex justify-content-between align-items-start mb-5">

            <div>

                <h1 class="fw-semibold mb-2">
                    My Tasks
                </h1>

                <p class="text-secondary fst-italic fs-6 mb-0">
                    Stay focused. Get things done.
                </p>

            </div>


            <div class="d-flex gap-3 align-items-center">

                <!-- Add Task Button -->
                <button class="btn btn-primary rounded-3 px-3" data-bs-toggle="modal" data-bs-target="#addTaskModal">

                    <i class="bi bi-plus-lg"></i>

                    Add Task

                </button>


                <!-- Clear All -->
                <button class="btn text-primary">

                    <i class="bi bi-trash"></i>

                    Clear all

                </button>

            </div>

        </div>



        <!-- Statistics -->
        <div class="row g-4 mb-5">


            <!-- Weekly Progress -->
            <div class="col-lg-8">

                <div class="card border rounded-4 h-100 bg-light-subtle">

                    <div class="card-body p-4">

                        <h6 class="mb-4">
                            Weekly Progress
                        </h6>


                        <div class="d-flex align-items-center gap-3 mb-4">

                            <span class="display-6 fw-semibold text-primary" id="taskstat">
                                0
                            </span>

                            <span class="text-secondary">
                                tasks finished
                            </span>
                            <span id="progressPercentage" class="ms-auto fw-semibold text-primary">
                                0%
                            </span>
                        </div>


                        <div class="progress" style="height: 4px;">

                            <div class="progress-bar bg-primary" id="progressbar" style="width: 0%;">
                            </div>

                        </div>

                    </div>

                </div>

            </div>



            <!-- Current Streak -->
            <div class="col-lg-4">

                <div class="card border rounded-4 h-100">

                    <div class="card-body p-4">

                        <div class="d-flex justify-content-between">

                            <h6>
                                Current Streak
                            </h6>

                            <i class="bi bi-fire fs-5 text-primary"></i>

                        </div>


                        <div class="mt-4">

                            <span class="display-6 fw-semibold">
                                5
                            </span>

                            <span class="text-secondary">
                                days
                            </span>

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <section class="mb-5">

            <h6 class="mb-4">
                Today is yours
            </h6>

            <div id="todayTasks"></div>

        </section>


    </main>



    <!-- Footer -->
    <footer class="border-top mt-5">

        <div class="container py-4">

            <div class="row align-items-center">


                <div class="col-md-4">

                    <strong>
                        TaskClear
                    </strong>

                </div>


                <div class="col-md-4 text-center text-secondary small">

                    © 2024 TaskClear. Built for clarity.

                </div>


                <div class="col-md-4">

                    <div class="d-flex justify-content-md-end justify-content-center gap-4 small">

                        <a href="#" class="text-decoration-none text-dark">
                            Privacy
                        </a>

                        <a href="#" class="text-decoration-none text-dark">
                            Terms
                        </a>

                        <a href="#" class="text-decoration-none text-dark">
                            Support
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </footer>



    <!-- Add Task Modal -->
    <div class="modal fade" id="addTaskModal" tabindex="-1" aria-hidden="true">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content border-0 rounded-4">


                <!-- Modal Header -->
                <div class="modal-header">

                    <h5 class="modal-title">
                        Add New Task
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>

                </div>



                <!-- Modal Body -->
                <div class="modal-body">


                    <!-- Task -->
                    <div class="mb-3">

                        <label class="form-label">
                            Task
                        </label>

                        <input type="text" class="form-control" placeholder="What needs to be done?" id="taskinput">

                    </div>



                    <!-- Description -->
                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea id="descriptioninput" class="form-control" rows="3"
                            placeholder="Add some details..."></textarea>

                    </div>



                    <!-- Category + Date -->
                    <div class="row g-3">


                        <!-- Category -->
                        <div class="col-md-6">

                            <label class="form-label">
                                Category
                            </label>

                            <select class="form-select" id="categoryinput">

                                <option selected>
                                    Select category
                                </option>

                                <option>
                                    Work
                                </option>

                                <option>
                                    Personal
                                </option>

                                <option>
                                    Study
                                </option>

                            </select>

                        </div>



                        <!-- Date -->
                        <div class="col-md-6">

                            <label class="form-label">
                                Due Date
                            </label>

                            <input id="dateinput" type="date" class="form-control">

                        </div>

                    </div>

                </div>



                <!-- Modal Footer -->
                <div class="modal-footer">

                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">

                        Cancel

                    </button>


                    <button id="btnaddtask" type="button" class="btn btn-primary px-4">

                        Add Task

                    </button>

                </div>

            </div>

        </div>

    </div>



    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="../frontend/index.js"></script>

</body>

</html>
